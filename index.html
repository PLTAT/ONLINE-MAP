"Eox At OpenStreetMap 3857": EoxAtOSM,
"Eox At 日 3857": EoxAtBlueMarble,
"Eox At 夜 3857": EoxAtBlackMarble,
"Eox At 仅路名 3857": EoxAtOverlayBase,
"Eox At 仅路名 镂空 3857": EoxAtOverlayBaseBright,
"高德 右偏移 卫星": amap6,
"高德 右偏移 仅路网": amap8,
"高德 右偏移 标准": amap7,
"高德 右偏移 少细节": amap9,
"高德 右偏移 简约": amap10,
"天地图 街道": vec0,
"天地图 卫星": img0,
"天地图 地形": ter0,
"天地图 地表覆盖 2000": glc2000,
"天地图 地表覆盖 2010": glc2010,
"天地图 地表覆盖 2020": glc2020,
"天地图 旧街道": vec2,
"天地图 旧街道 仅路名": cva,
"天地图 旧卫星": img2,
"天地图 旧卫星 仅路网": cia,
"天地图 旧地形": ter2,
"天地图 旧地形 仅路网": cta,
};
var overlays = {
"OpenStreetMap FR cyclosm-lite": osmfrcyclosmlite,
"Eox At 仅路名 3857": EoxAtOverlayBase,
"Eox At 仅路名 镂空 3857": EoxAtOverlayBaseBright,
"高德 右偏移 仅路网": amap8,
"天地图 旧街道 仅路名": cva,
"天地图 旧卫星 仅路网": cia,
"天地图 旧地形 仅路网": cta
};
L.control.layers(
baseLayers,
overlays
)
.addTo(map);

var popup = L.popup();

function onMapClick(local_get_lat_lng) {
popup
.setLatLng(local_get_lat_lng.latlng)
.setContent(" " + local_get_lat_lng.latlng.toString())
.openOn(map);
}

map.on('click', onMapClick);

function global_update_last_zoom() {
document.getElementById('global_show_last_lat').innerText = 'last_lat ' + map.getCenter().lat;
document.getElementById('global_show_last_lng').innerText = 'last_lng ' + map.getCenter().lng;
document.getElementById('global_show_last_zoom').innerText = 'last_zoom ' + map.getZoom();
}
map.on('zoomend', function() {
global_update_last_zoom();
}
);
global_update_last_zoom();

map.on('mousemove', function(local_get) {
document.getElementById('global_show_mouse_lat').innerText = 'mouse_lat ' + local_get.latlng.lat;
document.getElementById('global_show_mouse_lng').innerText = 'mouse_lng ' + local_get.latlng.lng;
document.getElementById('global_show_mouse_zoom').innerText = 'mouse_zoom ' + map.getZoom();
}
);

document.getElementById('global_lat_button').onclick = function() {
if (document.getElementById('global_lat_input').value) {
map.setView([document.getElementById('global_lat_input').value, map.getCenter().lng], map.getZoom());
}
};

document.getElementById('global_lng_button').onclick = function() {
if (document.getElementById('global_lng_input').value) {
map.setView([map.getCenter().lat, document.getElementById('global_lng_input').value], map.getZoom());
}
};

document.getElementById('global_zoom_button').onclick = function() {
if (document.getElementById('global_zoom_input').value) {
map.setZoom(document.getElementById('global_zoom_input').value);
}
};

document.getElementById('global_lat_lng_button').onclick = function() {
if (document.getElementById('global_lat_input').value && document.getElementById('global_lng_input').value) {
map.setView([document.getElementById('global_lat_input').value, document.getElementById('global_lng_input').value], map.getZoom());
}
};

document.getElementById('global_lat_lng_zoom_button').onclick = function() {
if (document.getElementById('global_lat_input').value && document.getElementById('global_lng_input').value && document.getElementById('global_zoom_input').value) {
map.setView([document.getElementById('global_lat_input').value, document.getElementById('global_lng_input').value], document.getElementById('global_zoom_input').value);
}
};

document.getElementById('global_beiping_button').onclick = function() {
map.setView([39.915735, 116.390810], map.getZoom());
};

</script>
</body>
</html>
